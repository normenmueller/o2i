name: Framework change
description: Propose a Significant or Protected change to O2I.
title: ""
labels:
  - framework-change
body:
  - type: markdown
    attributes:
      value: |
        Use this form for Significant or Protected terminology, metamodel,
        syntax, formalization, validation, or public API changes. Routine work
        uses the Maintenance form or an explicit Product Owner request.
  - type: dropdown
    id: change_path
    attributes:
      label: Change path
      description: Select the risk-proportionate path. Reclassify if later evidence changes the risk.
      options:
        - Significant
        - Protected
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What generic O2I problem exists, and who is affected?
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Generic benefit and O2I fit
      description: What improves for O2I users, and why does this belong in generic O2I?
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target state
      description: Describe the fresh coherent target design.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State the intended boundary and what remains outside it.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable conditions establish completion?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Which credible alternatives matter, and why are they insufficient? Leave empty when none materially differs.
  - type: textarea
    id: risks
    attributes:
      label: Risks
      description: Which semantic, technical, or usability risks must the design control?
    validations:
      required: true
  - type: textarea
    id: participants
    attributes:
      label: Participants and lineage
      description: Name coauthors and non-blocking source Issues; the Issue author is the change author.
      placeholder: |
        Coauthors: none
        Derived from: none
  - type: textarea
    id: reviews
    attributes:
      label: Required review capabilities
      description: Which independent capabilities are required by the actual risk?
