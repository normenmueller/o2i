name: Verify

on:
  push:
    tags:
      - 'o2i-v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  O2I_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  O2I_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  O2I_EVENT_NAME: ${{ github.event_name }}
  O2I_FORCE_FULL: ${{ startsWith(github.ref, 'refs/tags/o2i-v') }}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Change governance
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select verification scope
        id: scope
        run: |
          python3 -B utl/verification_scope.py \
            --event "$O2I_EVENT_NAME" \
            --base "$O2I_DIFF_BASE" \
            --head "$O2I_DIFF_HEAD" \
            --forced "$O2I_FORCE_FULL" \
            --format github >> "$GITHUB_OUTPUT"

      - name: Verify change governance
        if: steps.scope.outputs.governance == 'true'
        run: ./utl/verify.sh governance

      - name: Report skipped governance verification
        if: steps.scope.outputs.governance != 'true'
        run: echo "[o2i|info] Governance verification is not selected."

  model:
    name: Model contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select verification scope
        id: scope
        run: |
          python3 -B utl/verification_scope.py \
            --event "$O2I_EVENT_NAME" \
            --base "$O2I_DIFF_BASE" \
            --head "$O2I_DIFF_HEAD" \
            --forced "$O2I_FORCE_FULL" \
            --format github >> "$GITHUB_OUTPUT"

      - name: Verify model contracts
        if: steps.scope.outputs.model == 'true'
        run: ./utl/verify.sh model

      - name: Report skipped model verification
        if: steps.scope.outputs.model != 'true'
        run: echo "[o2i|info] Model verification is not selected."

  haskell:
    name: Haskell specification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CABAL_VERSION: 3.14.2.0
      GHC_VERSION: 9.6.5
      HINDENT_VERSION: 6.2.1

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select verification scope
        id: scope
        run: |
          python3 -B utl/verification_scope.py \
            --event "$O2I_EVENT_NAME" \
            --base "$O2I_DIFF_BASE" \
            --head "$O2I_DIFF_HEAD" \
            --forced "$O2I_FORCE_FULL" \
            --format github >> "$GITHUB_OUTPUT"

      - name: Set up Haskell
        if: steps.scope.outputs.haskell == 'true'
        uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2.11.0
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Restore Haskell dependencies and tools
        if: steps.scope.outputs.haskell == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            ~/.local/bin/hindent
          key: haskell-dependencies-${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-hindent-${{ env.HINDENT_VERSION }}-${{ hashFiles('spc/cabal.project', 'spc/**/*.cabal') }}
          restore-keys: |
            haskell-dependencies-${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-hindent-${{ env.HINDENT_VERSION }}-

      - name: Install Haskell verification tools
        if: steps.scope.outputs.haskell == 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v hindent >/dev/null 2>&1; then
            cabal install "hindent-$HINDENT_VERSION" \
              --installdir="$HOME/.local/bin" \
              --overwrite-policy=always
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Haskell specification
        if: steps.scope.outputs.haskell == 'true'
        run: ./utl/verify.sh haskell

      - name: Report skipped Haskell verification
        if: steps.scope.outputs.haskell != 'true'
        run: echo "[o2i|info] Haskell verification is not selected."

  paper:
    name: White Paper
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Select verification scope
        id: scope
        run: |
          python3 -B utl/verification_scope.py \
            --event "$O2I_EVENT_NAME" \
            --base "$O2I_DIFF_BASE" \
            --head "$O2I_DIFF_HEAD" \
            --forced "$O2I_FORCE_FULL" \
            --format github >> "$GITHUB_OUTPUT"

      - name: Install White Paper dependencies
        if: steps.scope.outputs.paper == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates \
            curl \
            lmodern \
            pipx \
            poppler-utils \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-lang-german \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-plain-generic \
            xz-utils

          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"

          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/pandoc.tar.gz" \
            https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-linux-amd64.tar.gz
          echo "872a10c7ec29d5278831d855b11bd4ade0df4d5ec9a089a3197bc63a37eb4003  $RUNNER_TEMP/pandoc.tar.gz" \
            | sha256sum --check
          tar --extract --gzip \
            --file "$RUNNER_TEMP/pandoc.tar.gz" \
            --directory "$RUNNER_TEMP"
          cp --recursive "$RUNNER_TEMP/pandoc-3.9/." "$HOME/.local/"

          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/pandoc-crossref.tar.xz" \
            https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.24/pandoc-crossref-Linux-X64.tar.xz
          echo "0a019c6627347fc2fd72ecf7df8f95fb7929ceb84fc0fbb0340a6f53cd34fd95  $RUNNER_TEMP/pandoc-crossref.tar.xz" \
            | sha256sum --check
          mkdir "$RUNNER_TEMP/pandoc-crossref"
          tar --extract --xz \
            --file "$RUNNER_TEMP/pandoc-crossref.tar.xz" \
            --directory "$RUNNER_TEMP/pandoc-crossref"
          install \
            "$(find "$RUNNER_TEMP/pandoc-crossref" -type f -name pandoc-crossref -print -quit)" \
            "$HOME/.local/bin/pandoc-crossref"

          pipx install pandoc-include==1.4.4
          md2pdf_revision=$(
            python3 -B utl/check-pdf-freshness.py contract \
              --root . \
              --field acquisition-revision
          )
          git clone \
            --filter=blob:none \
            --no-checkout \
            https://github.com/normenmueller/md2pdf.git \
            "$RUNNER_TEMP/md2pdf"
          git -C "$RUNNER_TEMP/md2pdf" checkout \
            "$md2pdf_revision"
          make -C "$RUNNER_TEMP/md2pdf" PREFIX="$HOME/.local" install
          python3 -B utl/check-pdf-freshness.py renderer --root .
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify White Paper
        if: steps.scope.outputs.paper == 'true'
        run: ./utl/verify.sh paper

      - name: Report skipped White Paper verification
        if: steps.scope.outputs.paper != 'true'
        run: echo "[o2i|info] White Paper verification is not selected."
