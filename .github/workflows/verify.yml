name: Verify

on:
  push:
    tags:
      - 'o2i-v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  O2I_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  O2I_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  O2I_EVENT_NAME: ${{ github.event_name }}
  O2I_FORCE_FULL: ${{ startsWith(github.ref, 'refs/tags/o2i-v') }}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licensing:
    name: Repository licensing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REUSE_VERSION: 6.2.0

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select verification scope
        id: scope
        run: |
          python3 -B utl/verification/verification_scope.py \
            --event "$O2I_EVENT_NAME" \
            --base "$O2I_DIFF_BASE" \
            --head "$O2I_DIFF_HEAD" \
            --forced "$O2I_FORCE_FULL" \
            --format github >> "$GITHUB_OUTPUT"

      - name: Install licensing verification tools
        if: steps.scope.outputs.licensing == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pipx
          pipx install "reuse[charset-normalizer]==$REUSE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify repository licensing
        if: steps.scope.outputs.licensing == 'true'
        run: ./utl/verify.sh licensing

      - name: Report skipped licensing verification
        if: steps.scope.outputs.licensing != 'true'
        run: echo "[o2i|info] Repository licensing verification is not selected."

  governance:
    name: Change governance
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select verification scope
        id: scope
        run: |
          python3 -B utl/verification/verification_scope.py \
            --event "$O2I_EVENT_NAME" \
            --base "$O2I_DIFF_BASE" \
            --head "$O2I_DIFF_HEAD" \
            --forced "$O2I_FORCE_FULL" \
            --format github >> "$GITHUB_OUTPUT"

      - name: Verify change governance
        if: steps.scope.outputs.governance == 'true'
        run: ./utl/verify.sh governance

      - name: Report skipped governance verification
        if: steps.scope.outputs.governance != 'true'
        run: echo "[o2i|info] Governance verification is not selected."

  model:
    name: Model contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select verification scope
        id: scope
        run: |
          python3 -B utl/verification/verification_scope.py \
            --event "$O2I_EVENT_NAME" \
            --base "$O2I_DIFF_BASE" \
            --head "$O2I_DIFF_HEAD" \
            --forced "$O2I_FORCE_FULL" \
            --format github >> "$GITHUB_OUTPUT"

      - name: Verify model contracts
        if: steps.scope.outputs.model == 'true'
        run: ./utl/verify.sh model

      - name: Report skipped model verification
        if: steps.scope.outputs.model != 'true'
        run: echo "[o2i|info] Model verification is not selected."

  haskell:
    name: Haskell specification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CABAL_VERSION: 3.16.1.0
      GHC_VERSION: 9.10.3
      HINDENT_VERSION: 6.3.0
      HINDENT_SHA256: 9b359816c72df2039ee9b88f70c6b70e8dd20008cbef315291d01fbfa3897cfa
      REUSE_VERSION: 6.2.0

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select verification scope
        id: scope
        run: |
          python3 -B utl/verification/verification_scope.py \
            --event "$O2I_EVENT_NAME" \
            --base "$O2I_DIFF_BASE" \
            --head "$O2I_DIFF_HEAD" \
            --forced "$O2I_FORCE_FULL" \
            --format github >> "$GITHUB_OUTPUT"

      - name: Set up Haskell
        if: steps.scope.outputs.haskell == 'true'
        uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2.11.0
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Restore Haskell dependencies and tools
        if: steps.scope.outputs.haskell == 'true'
        id: haskell_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            ~/.local/bin/hindent
          key: haskell-dependencies-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-hindent-${{ env.HINDENT_VERSION }}-${{ env.HINDENT_SHA256 }}-${{ hashFiles('spec/.ghc-version', 'spec/cabal.project', 'spec/cabal.project.freeze', 'spec/cabal.foundation.project', 'spec/cabal.foundation.project.freeze', 'spec/**/*.cabal') }}
          restore-keys: |
            haskell-dependencies-${{ runner.os }}-${{ runner.arch }}-ghc-${{ env.GHC_VERSION }}-cabal-${{ env.CABAL_VERSION }}-hindent-${{ env.HINDENT_VERSION }}-${{ env.HINDENT_SHA256 }}-

      - name: Report Haskell dependency cache
        if: steps.scope.outputs.haskell == 'true'
        env:
          O2I_HASKELL_CACHE_HIT: ${{ steps.haskell_cache.outputs.cache-hit }}
        run: |
          printf '[o2i|info] Haskell dependency cache restore: cache-hit=%s.\n' \
            "${O2I_HASKELL_CACHE_HIT:-unreported}"

      - name: Install Foundation verification tools
        if: steps.scope.outputs.haskell == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pipx
          pipx install "reuse[charset-normalizer]==$REUSE_VERSION"

      - name: Install and verify Hindent
        if: steps.scope.outputs.haskell == 'true'
        run: |
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          hindent_binary="$HOME/.local/bin/hindent"
          if [ ! -f "$hindent_binary" ]; then
            hindent_download=$(mktemp)
            trap 'rm -f "$hindent_download"' EXIT
            curl --fail --location --retry 3 \
              "https://github.com/mihaimaruseac/hindent/releases/download/v$HINDENT_VERSION/hindent" \
              --output "$hindent_download"
            printf '%s  %s\n' "$HINDENT_SHA256" "$hindent_download" | sha256sum --check --status
            install -m 0755 "$hindent_download" "$hindent_binary"
          fi
          printf '%s  %s\n' "$HINDENT_SHA256" "$hindent_binary" | sha256sum --check --status
          hindent_version=$("$hindent_binary" --version)
          test "$hindent_version" = "hindent $HINDENT_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          find spec -path '*/dist-newstyle' -prune -o \
            -type f -name '*.hs' \
            -exec "$hindent_binary" --line-length 80 --validate {} +

      - name: Verify Haskell specification
        if: steps.scope.outputs.haskell == 'true'
        run: |
          if [ "$O2I_EVENT_NAME" = 'pull_request' ]; then
            ./utl/verify.sh foundation
          else
            ./utl/verify.sh haskell
          fi

      - name: Report skipped Haskell verification
        if: steps.scope.outputs.haskell != 'true'
        run: echo "[o2i|info] Haskell verification is not selected."

  paper:
    name: White Paper
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Select verification scope
        id: scope
        run: |
          python3 -B utl/verification/verification_scope.py \
            --event "$O2I_EVENT_NAME" \
            --base "$O2I_DIFF_BASE" \
            --head "$O2I_DIFF_HEAD" \
            --forced "$O2I_FORCE_FULL" \
            --format github >> "$GITHUB_OUTPUT"

      - name: Install White Paper dependencies
        if: steps.scope.outputs.paper == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates \
            curl \
            lmodern \
            pipx \
            poppler-utils \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-lang-german \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-plain-generic \
            xz-utils

          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"

          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/pandoc.tar.gz" \
            https://github.com/jgm/pandoc/releases/download/3.9/pandoc-3.9-linux-amd64.tar.gz
          echo "872a10c7ec29d5278831d855b11bd4ade0df4d5ec9a089a3197bc63a37eb4003  $RUNNER_TEMP/pandoc.tar.gz" \
            | sha256sum --check
          tar --extract --gzip \
            --file "$RUNNER_TEMP/pandoc.tar.gz" \
            --directory "$RUNNER_TEMP"
          cp --recursive "$RUNNER_TEMP/pandoc-3.9/." "$HOME/.local/"

          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/pandoc-crossref.tar.xz" \
            https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.24/pandoc-crossref-Linux-X64.tar.xz
          echo "0a019c6627347fc2fd72ecf7df8f95fb7929ceb84fc0fbb0340a6f53cd34fd95  $RUNNER_TEMP/pandoc-crossref.tar.xz" \
            | sha256sum --check
          mkdir "$RUNNER_TEMP/pandoc-crossref"
          tar --extract --xz \
            --file "$RUNNER_TEMP/pandoc-crossref.tar.xz" \
            --directory "$RUNNER_TEMP/pandoc-crossref"
          install \
            "$(find "$RUNNER_TEMP/pandoc-crossref" -type f -name pandoc-crossref -print -quit)" \
            "$HOME/.local/bin/pandoc-crossref"

          pipx install pandoc-include==1.4.4
          md2pdf_revision=$(
            python3 -B utl/paper/check-pdf-freshness.py contract \
              --root . \
              --field acquisition-revision
          )
          git clone \
            --filter=blob:none \
            --no-checkout \
            https://github.com/normenmueller/md2pdf.git \
            "$RUNNER_TEMP/md2pdf"
          git -C "$RUNNER_TEMP/md2pdf" checkout \
            "$md2pdf_revision"
          make -C "$RUNNER_TEMP/md2pdf" PREFIX="$HOME/.local" install
          python3 -B utl/paper/check-pdf-freshness.py renderer --root .
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify White Paper
        if: steps.scope.outputs.paper == 'true'
        run: ./utl/verify.sh paper

      - name: Report skipped White Paper verification
        if: steps.scope.outputs.paper != 'true'
        run: echo "[o2i|info] White Paper verification is not selected."
